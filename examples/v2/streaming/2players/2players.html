<!DOCTYPE html>
<html lang="en" data-wcs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../../dependencies/css/streaming.css">
    <title>Two Players</title>
    <script src="../../../../flashphoner.js"></script>
    <script src="../../dependencies/ports.js"></script>
    <script type="module" src="2players.js"></script>
</head>
<body>
<main class="page-shell streaming-example">
    <header class="page-heading"><h1>Two Players</h1></header>
    <div id="notifyFatal" class="notification text-danger" role="alert"></div>
    <section class="preview-section" aria-label="Stream playback">
        <div class="preview-grid">
            <div class="preview-column">
                <article class="preview-card">
                    <div class="preview-frame">
                        <h2 class="preview-caption">Player 1</h2>
                        <div class="fp-remoteVideo"><div id="player1" class="display"></div></div>
                    </div>
                    <div class="control-group preview-action">
                        <input id="streamName1" class="control" type="text" value="streamName1" aria-label="Player 1 stream name" disabled>
                        <div class="control-group-action"><button id="playBtn1" class="button button-primary" type="button" disabled>Play</button></div>
                    </div>
                    <div class="preview-status" data-empty="true" role="status" aria-live="polite" aria-label="Player 1 status"><span class="status-prefix">Status:</span> <span id="status1"></span></div>
                    <div id="error1" class="status-error preview-error" role="alert" hidden></div>
                </article>
            </div>
            <div class="preview-column">
                <article class="preview-card">
                    <div class="preview-frame">
                        <h2 class="preview-caption">Player 2</h2>
                        <div class="fp-remoteVideo"><div id="player2" class="display"></div></div>
                    </div>
                    <div class="control-group preview-action">
                        <input id="streamName2" class="control" type="text" value="streamName2" aria-label="Player 2 stream name" disabled>
                        <div class="control-group-action"><button id="playBtn2" class="button button-primary" type="button" disabled>Play</button></div>
                    </div>
                    <div class="preview-status" data-empty="true" role="status" aria-live="polite" aria-label="Player 2 status"><span class="status-prefix">Status:</span> <span id="status2"></span></div>
                    <div id="error2" class="status-error preview-error" role="alert" hidden></div>
                </article>
            </div>
        </div>
        <section class="connection-panel" aria-label="Connection">
            <div class="connection-main">
                <div class="connection-fields">
                    <div id="connectionForm" class="control-group">
                        <input id="url" class="control" type="text" aria-label="WebSocket server URL">
                        <div class="control-group-action"><button id="connectBtn" class="button button-primary" type="button" disabled>Connect</button></div>
                    </div>
                </div>
                <div class="connection-status">
                    <div class="connection-status-line" data-empty="true" role="status" aria-live="polite"><span class="status-prefix">Status:</span> <span id="connectStatus"></span></div>
                </div>
                <div id="connectError" class="status-error connection-error" role="alert" hidden></div>
            </div>
        </section>
    </section>
</main>
</body>
</html>
