<!DOCTYPE html>
<html lang="en" data-wcs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../../dependencies/css/streaming.css">
    <title>Stream Client with Zoom</title>
    <script src="../../../../flashphoner.js"></script>
    <script src="../../dependencies/ports.js"></script>
    <script type="module" src="stream-zoom.js"></script>
</head>
<body>
<main class="page-shell streaming-example">
    <header class="page-heading"><h1>Stream Client with Zoom</h1></header>
    <div id="notifyFatal" class="notification text-danger" role="alert"></div>
    <section class="preview-section" aria-label="Stream previews">
        <div class="preview-grid">
            <article class="preview-card"><div class="preview-frame">
                <h2 class="preview-caption">My camera</h2>
                <div class="fp-remoteVideo"><div id="localVideo" class="display"></div></div>
            </div></article>
            <article class="preview-card"><div class="preview-frame">
                <h2 class="preview-caption">Server preview</h2>
                <div class="fp-remoteVideo"><div id="remoteVideo" class="display"></div></div>
            </div></article>
        </div>
        <section class="connection-panel" aria-label="Connection">
            <div class="connection-main">
                <div class="connection-fields"><div class="control-group">
                    <input id="url" class="control" type="text" placeholder="wss://server:8443/stream" aria-label="WebSocket URL and stream name">
                    <div class="control-group-action"><button id="publishBtn" type="button" class="button button-primary" disabled>Start</button></div>
                </div></div>
                <div class="connection-status" role="status" aria-live="polite"><span class="status-prefix">Status:</span> <span id="status"></span></div>
                <div id="info" class="status-error connection-error" role="alert" hidden></div>
            </div>
        </section>
    </section>
    <section class="settings-card settings-section" aria-labelledby="zoomHeading">
        <h2 id="zoomHeading" class="section-heading">Camera zoom</h2>
        <div class="field-row">
            <label class="field-label" for="zoom">Zoom</label>
            <div class="field-content slider-field"><input id="zoom" type="range" min="1" max="1" step="1" value="1" disabled></div>
        </div>
        <p id="zoomInfo" class="stream-note" role="status" aria-live="polite">Start streaming to check the camera's zoom support.</p>
        <div id="zoomError" class="status-error" role="alert" hidden></div>
    </section>
</main>
</body>
</html>
